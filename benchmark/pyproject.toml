[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stm-agent-benchmark"
version = "0.2.0"
description = "Reproducible STM workflow benchmark with guarded Nanonis Demo acquisition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
stm-bench = "stm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["stm_bench*"]

[tool.setuptools.package-data]
stm_bench = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
